name: Deploy Zteam to VPS

on:
  push:
    branches:
      - main

concurrency:
  group: zteam-production
  # Never cancel a deploy that is already running (it could be between publishing the site and
  # restarting the API). A newer push waits in the queue and deploys right after.
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e

            echo "=== Updating Zteam source ==="
            cd /home/zteam/apps/zteam-app
            git fetch origin main
            git reset --hard origin/main

            echo "=== Installing server dependencies ==="
            cd /home/zteam/apps/zteam-app/server
            npm ci

            echo "=== Installing client dependencies ==="
            cd /home/zteam/apps/zteam-app/client
            npm ci

            echo "=== Building client ==="
            npm run build

            echo "=== Publishing client ==="
            # scripts/publish-client.sh (tested by scripts/test-publish-client.sh in CI):
            #  - never bulk-deletes the web root (uploads and anything else in it are untouched)
            #  - copies new fingerprinted assets without removing existing ones; assets that are no longer
            #    referenced are removed only after 14 days
            #  - atomic writes, index.html + version.json switched last, automatic rollback on any failure
            #  - a failure stops the deploy HERE (set -e), before the backend restart, so API and site stay consistent
            bash /home/zteam/apps/zteam-app/scripts/publish-client.sh /home/zteam/apps/zteam-app/client/dist /var/www/zteam 14

            echo "=== Restarting backend ==="
            pm2 restart zteam-server --update-env

            echo "=== Checking PM2 ==="
            pm2 status

            echo "=== Checking production API ==="
            sleep 3
            curl -fsS https://zteam.zeekerstech.com/api/health

            echo ""
            echo "=== Deployment successful ==="