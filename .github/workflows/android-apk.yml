name: Zteam Android APK

# Runs ONLY for android tags (e.g. android-v1.0.9) or when started by hand from the
# Actions tab. It never runs on a push to main, so it cannot affect the production
# deploy, and it does not match the desktop release tags (v*.*.*).
on:
  push:
    tags:
      - "android-v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Add Android platform
        run: npx cap add android

      - name: Grant camera / microphone permissions (for calls and meetings)
        run: |
          python3 - <<'PY'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          perms = ''.join(
              f'    <uses-permission android:name="android.permission.{n}" />\n'
              for n in ['CAMERA', 'RECORD_AUDIO', 'MODIFY_AUDIO_SETTINGS', 'POST_NOTIFICATIONS']
          )
          s = s.replace('</manifest>', perms + '</manifest>')
          open(p, 'w').write(s)
          PY

      - name: Set app version from tag
        run: |
          NAME="${GITHUB_REF_NAME#android-v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then NAME="1.0.0-dev"; fi
          sed -i "s/versionCode 1/versionCode ${GITHUB_RUN_NUMBER}/; s/versionName \"1.0\"/versionName \"${NAME}\"/" android/app/build.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Zteam.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zteam-apk
          path: mobile/Zteam.apk

      - name: Attach APK to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/Zteam.apk
